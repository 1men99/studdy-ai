services:
  - type: web
    name: study-ai-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    region: oregon
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://studdy.ai,http://localhost:5173
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CONVEX_URL
        value: https://laudable-buzzard-834.convex.cloud
      - key: RATE_LIMIT
        value: 30/minute
      - key: GROQ_API_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_ISSUER
        sync: false
